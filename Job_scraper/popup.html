<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .loading {
      background-color: #fff3cd;
      color: #856404;
    }
    .url-display {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <button id="scrapeBtn">Scrape This Job Page</button>
  <div class="url-display" id="urlDisplay"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
